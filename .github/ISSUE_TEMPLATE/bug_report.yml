name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide the following information.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What is the problem?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible example
      description: Minimal code snippet that reproduces the issue
      placeholder: |
        from qmath import ...
        # Your code here
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS (e.g., Ubuntu 22.04, macOS 13.1, Windows 11)
        - Python version (e.g., 3.11, 3.12)
        - qmath version
        - NumPy/SciPy versions
      value: |
        - OS:
        - Python version:
        - qmath version:
        - Dependencies:
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback (if applicable)
      description: Full error message and traceback
      render: python

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem?
