name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for the feature request! Please describe your idea clearly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the proposed feature
      placeholder: What would you like to add or improve?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
      placeholder: What is the use case?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage (if applicable)
      description: How would users interact with this feature?
      render: python

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've considered?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant information?
