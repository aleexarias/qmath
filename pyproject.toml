[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmath"
version = "0.1.0.dev0"
description = "Research library for option-implied risk-neutral density estimation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Alexander Arias", email = "aleexariasg@gmail.com"},
]
keywords = ["quantitative-finance", "options", "density-estimation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.90",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.14",
    "sphinx-gallery>=0.14",
    "numpydoc>=1.6",
    "matplotlib>=3.8",
    "sphinxcontrib-bibtex>=2.6",
]

[project.urls]
Documentation = "https://qmath.readthedocs.io"
Repository = "https://github.com/aleexarias/qmath"
Issues = "https://github.com/aleexarias/qmath/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qmath"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501", "N803", "N806", "N813"]  # Allow mathematical variable names (S, K, T, etc.)

[tool.ruff.lint.isort]
known-first-party = ["qmath"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers -v --tb=short"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["qmath"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*@abstractmethod",
]
